<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Resume Card</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to card</a>
    <header class="masthead">
      <div class="brand-mark" aria-hidden="true"><span></span></div>
      <div>
        <p class="eyebrow">Saved card</p>
        <h1>Focus Resume Card</h1>
      </div>
      <button class="icon-button" id="settings-button" aria-label="Open settings" title="Settings">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2m4 0h10M14 4v6M6 14v6" /></svg>
      </button>
    </header>

    <main id="main" tabindex="-1">
      <div id="offline-note" class="offline-note" hidden>
        <strong>Offline.</strong> Your card still works and stays on this device.
      </div>
      <section id="loading-view" class="loading-view" aria-live="polite">
        <div class="contour-loader" aria-hidden="true"></div>
        <p>Loading your saved card…</p>
      </section>
      <section id="card-view" hidden></section>
      <section id="capture-view" hidden></section>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>

    <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-copy">
      <form method="dialog">
        <p class="eyebrow">Confirm change</p>
        <h2 id="confirm-title">Clear this saved card?</h2>
        <p id="confirm-copy">The saved next action and local context will be removed.</p>
        <div class="button-row">
          <button class="button secondary" value="cancel">Keep card</button>
          <button class="button danger" id="confirm-action" value="confirm">Clear card</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
